spring.application.name=ApiGatewayEduCommerce

server.port=8080

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.routes[0].id=studentService
spring.cloud.gateway.routes[0].uri=lb://STUDENTSERVICE
spring.cloud.gateway.routes[0].predicates=Path=/students/**

spring.cloud.gateway.routes[1].id=resultService
spring.cloud.gateway.routes[1].uri=lb://RESULTSERVICE
spring.cloud.gateway.routes[1].predicates=Path=/results/**

spring.cloud.gateway.routes[2].id=attendanceService
spring.cloud.gateway.routes[2].uri=lb://ATTENDANCESERVICE
spring.cloud.gateway.routes[2].predicates=Path=/attendance/**

spring.cloud.gateway.routes[3].id=studentService
spring.cloud.gateway.routes[3].uri=lb://STUDENTSERVICE
spring.cloud.gateway.routes[3].predicates=Path=/courses/**

spring.cloud.gateway.routes[4].id=studentService
spring.cloud.gateway.routes[4].uri=lb://STUDENTSERVICE
spring.cloud.gateway.routes[4].predicates=Path=/enroll/**

spring.cloud.gateway.routes[5].id=studentService
spring.cloud.gateway.routes[5].uri=lb://STUDENTSERVICE
spring.cloud.gateway.routes[5].predicates=Path=/students/*/courses

spring.cloud.gateway.routes[6].id=studentService
spring.cloud.gateway.routes[6].uri=lb://STUDENTSERVICE
spring.cloud.gateway.routes[6].predicates=Path=/api/**

